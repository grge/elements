<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dual Plane UI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            background: #1a1a1a;
        }

        .viewport {
            width: 100vw;
            height: 100vh;
            overflow: visible;
            position: relative;
        }

        .container {
            width: 210vw;
            height: 100vh;
            display: flex;
            position: relative;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            margin-left: -5vw;
        }

        .container.scroll-right {
            transform: translateX(-90vw);
        }

        .ribbon {
            position: absolute;
            top: 30px;
            left: 52.5vw;
            width: 105vw;
            height: 60px;
            padding: 12px 40px;
            display: flex;
            align-items: center;
            gap: 30px;
            background: rgba(255, 180, 100, 0.3);
            z-index: 20;
            border-radius: 30px;
            pointer-events: none;
        }

        .ribbon-content {
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .panel {
            width: 100vw;
            height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Red panel (Book/EQ-Triangle) */
        .panel-red {
            background: linear-gradient(135deg, #ff4757 0%, #ff6b6b 100%);
            color: white;
            clip-path: polygon(5% 0%, 100% 0%, 100% 100%, 0% 100%);
            margin-left: -2.5vw;
        }

        /* Purple panel (Scratch Pad) */
        .panel-purple {
            background: linear-gradient(135deg, #5352ed 0%, #3c2e8f 100%);
            color: white;
            clip-path: polygon(0% 0%, 100% 0%, 95% 100%, 0% 100%);
            margin-right: -2.5vw;
        }

        /* Slanted divider line */
        .divider {
            display: none;
        }

        .header-label {
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 2px;
            white-space: nowrap;
        }

        .header-subtitle {
            font-size: 16px;
            opacity: 0.95;
            letter-spacing: 1px;
            padding: 6px 20px;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 20px;
            white-space: nowrap;
        }

        /* Content area */
        .content {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-top: 60px;
        }

        /* Text box on red panel */
        .text-box {
            position: absolute;
            left: 60px;
            top: 260px;
            border: 2px solid rgba(255, 255, 255, 0.4);
            padding: 30px;
            font-family: 'Courier New', monospace;
            font-size: 18px;
            line-height: 1.8;
            max-width: 450px;
        }

        /* SVG containers */
        svg {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }

        .diagram-container {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div class="viewport">
        <div class="container">
            <div class="ribbon">
                <div class="ribbon-content">
                    <span class="header-subtitle">SCRATCH PAD</span>
                    <span style="opacity: 0.5;">|</span>
                    <span class="header-label">BOOK</span>
                    <span class="header-subtitle">EQ-TRIANGLE</span>
                </div>
            </div>
            <!-- Purple Panel (SCRATCH PAD) -->
            <div class="panel panel-purple">
                <div class="divider">
                    <svg viewBox="0 0 100 100" preserveAspectRatio="none">
                        <line x1="20" y1="0" x2="0" y2="100" stroke="rgba(0,0,0,0.2)" stroke-width="2"/>
                    </svg>
                </div>

                <div class="content">
                    <div style="position: absolute; left: 40px; top: 100px; font-family: 'Courier New', monospace; font-size: 14px; line-height: 1.6; opacity: 0.7;">
                        Eq-triangle a b c:<br>
                        &nbsp;&nbsp;Circle a b c<br>
                        &nbsp;&nbsp;Circle b a c<br>
                        <br>
                        ? eq-lines a b a c
                    </div>

                    <svg class="diagram-container" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
                        <!-- Venn diagram -->
                        <circle cx="900" cy="400" r="200" fill="none" stroke="#d4a574" stroke-width="3"/>
                        <circle cx="1100" cy="400" r="200" fill="none" stroke="#d4a574" stroke-width="3"/>

                        <!-- Labels -->
                        <text x="800" y="430" font-size="32" fill="white" font-weight="bold" text-anchor="middle">A</text>
                        <text x="1000" y="430" font-size="32" fill="white" font-weight="bold" text-anchor="middle">•</text>
                        <text x="1200" y="430" font-size="32" fill="white" font-weight="bold" text-anchor="middle">B</text>
                        <text x="1000" y="220" font-size="32" fill="white" font-weight="bold" text-anchor="middle">C</text>

                        <!-- Center dots -->
                        <circle cx="820" cy="400" r="4" fill="white"/>
                        <circle cx="980" cy="400" r="4" fill="white"/>
                        <circle cx="1000" cy="220" r="4" fill="white"/>
                    </svg>
                </div>

            </div>

            <!-- Red Panel (BOOK / EQ-TRIANGLE) -->
            <div class="panel panel-red">
                <div class="divider">
                    <svg viewBox="0 0 100 100" preserveAspectRatio="none">
                        <line x1="20" y1="0" x2="0" y2="100" stroke="rgba(0,0,0,0.2)" stroke-width="2"/>
                    </svg>
                </div>

                <div class="content">
                    <div class="text-box">
                        EQ-TRIANGLE A B C:<br>
                        <br>
                        CIRCLE A B C<br>
                        CIRCLE B A C
                    </div>

                    <svg class="diagram-container" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
                        <!-- Venn diagram -->
                        <circle cx="900" cy="400" r="200" fill="none" stroke="white" stroke-width="3"/>
                        <circle cx="1100" cy="400" r="200" fill="none" stroke="white" stroke-width="3"/>

                        <!-- Labels -->
                        <text x="800" y="430" font-size="32" fill="white" font-weight="bold" text-anchor="middle">A</text>
                        <text x="1000" y="430" font-size="32" fill="white" font-weight="bold" text-anchor="middle">•</text>
                        <text x="1200" y="430" font-size="32" fill="white" font-weight="bold" text-anchor="middle">B</text>
                        <text x="1000" y="220" font-size="32" fill="white" font-weight="bold" text-anchor="middle">C</text>

                        <!-- Center dots -->
                        <circle cx="820" cy="400" r="4" fill="white"/>
                        <circle cx="980" cy="400" r="4" fill="white"/>
                        <circle cx="1000" cy="220" r="4" fill="white"/>
                    </svg>
                </div>
            </div>
        </div>
    </div>

    <script>
        const container = document.querySelector('.container');
        let isScrolledRight = false;

        function togglePanel() {
            isScrolledRight = !isScrolledRight;
            container.classList.toggle('scroll-right');
        }

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' && isScrolledRight) togglePanel();
            if (e.key === 'ArrowRight' && !isScrolledRight) togglePanel();
        });
    </script>
</body>
</html>
